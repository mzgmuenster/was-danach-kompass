name: Morgen-Impuls

on:
  schedule:
    # 05:17 UTC = 07:17 MESZ. Bewusst eine krumme Minute: GitHub verschiebt oder
    # verwirft geplante Laeufe zur vollen Stunde haeufig wegen Ueberlast.
    # Fuer den Winter auf "17 6 * * *" umstellen.
    - cron: "17 5 * * *"
  workflow_dispatch:        # erlaubt manuelles Auslösen im Actions-Tab

permissions:
  contents: write        # noetig, damit der Lauf zuletzt.txt zurueckschreiben darf

jobs:
  impuls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SMTP-Konfiguration aus Secrets erzeugen
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAILS: ${{ secrets.TO_EMAILS }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ["smtp_server", "smtp_port", "smtp_user", "smtp_password", "from_email"]
          cfg = {k: os.environ.get(k.upper(), "").strip() for k in keys}
          roh = os.environ.get("TO_EMAILS", "").strip()
          try:
              cfg["to_emails"] = json.loads(roh)
          except Exception:
              cfg["to_emails"] = [a.strip().strip('"').strip("'") for a in roh.strip("[]").split(",") if a.strip()]
          open("smtp_config.json", "w").write(json.dumps(cfg, ensure_ascii=False))
          print("Empfaenger:", cfg["to_emails"])
          PY

      - name: Impuls verschicken
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 impuls_mail.py

      - name: Versand vermerken
        run: |
          if [ -n "$(git status --porcelain zuletzt.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add zuletzt.txt
            git commit -m "Versand vermerkt"
            git push
          else
            echo "Nichts zu vermerken."
          fi
